name: span
arch: ${GOARCH}
platform: linux
version: ${SEMVER}
version_schema: semver
epoch: 0
release: 0
section: utils
priority: optional
maintainer: Martin Czygan <martin.czygan@uni-leipzig.de>
description: Assorted command line utilities to parse and convert metadata formats, apply licensing, and more.
vendor: Leipzig University Library
homepage: https://github.com/ubleipzig/span
license: MIT
disable_globbing: false

contents:
  # Binaries
  - src: build/span-compact
    dst: /usr/local/bin/span-compact
    file_info:
      mode: 0755

  - src: build/span-crossref-fast-snapshot
    dst: /usr/local/bin/span-crossref-fast-snapshot
    file_info:
      mode: 0755

  - src: build/span-crossref-fastproc
    dst: /usr/local/bin/span-crossref-fastproc
    file_info:
      mode: 0755

  - src: build/span-crossref-members
    dst: /usr/local/bin/span-crossref-members
    file_info:
      mode: 0755

  - src: build/span-crossref-snapshot
    dst: /usr/local/bin/span-crossref-snapshot
    file_info:
      mode: 0755

  - src: build/span-crossref-sync
    dst: /usr/local/bin/span-crossref-sync
    file_info:
      mode: 0755

  - src: build/span-crossref-table
    dst: /usr/local/bin/span-crossref-table
    file_info:
      mode: 0755

  - src: build/span-doisniffer
    dst: /usr/local/bin/span-doisniffer
    file_info:
      mode: 0755

  - src: build/span-export
    dst: /usr/local/bin/span-export
    file_info:
      mode: 0755

  - src: build/span-folio
    dst: /usr/local/bin/span-folio
    file_info:
      mode: 0755

  - src: build/span-freeze
    dst: /usr/local/bin/span-freeze
    file_info:
      mode: 0755

  - src: build/span-import
    dst: /usr/local/bin/span-import
    file_info:
      mode: 0755

  - src: build/span-index
    dst: /usr/local/bin/span-index
    file_info:
      mode: 0755

  - src: build/span-local-data
    dst: /usr/local/bin/span-local-data
    file_info:
      mode: 0755

  - src: build/span-mail
    dst: /usr/local/bin/span-mail
    file_info:
      mode: 0755

  - src: build/span-oa-filter
    dst: /usr/local/bin/span-oa-filter
    file_info:
      mode: 0755

  - src: build/span-redact
    dst: /usr/local/bin/span-redact
    file_info:
      mode: 0755

  - src: build/span-tag
    dst: /usr/local/bin/span-tag
    file_info:
      mode: 0755

  - src: build/span-update-labels
    dst: /usr/local/bin/span-update-labels
    file_info:
      mode: 0755

  # Man page
  - src: docs/span.1
    dst: /usr/local/share/man/man1/span.1
    file_info:
      mode: 0644

umask: 0o002

deb:
  compression: zstd

rpm:
  compression: zstd
